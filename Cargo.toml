[package]
name = "kloak"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A CLI tool to generate 6 digit OTPs"

[dependencies]
data-encoding = "2.3"
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
totp-rs = "5.7.1"
xdg = "2"
keyring = "4.0.1"
keyring-core = "1.0.0"
